<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADDISON — Compliance Inspector · vertical slice</title>
    <style>
      /* The desk metaphor is half the feel. Tier 8 proper (rendered binder
         pages, stamp ink impressions) is deferred; this is DOM standing in,
         styled close enough to judge the flow. */
      :root {
        --paper: #d9d2be;
        --paper-2: #cbc3ac;
        --manila: #c2a878;
        --ink: #2b2721;
        --ink-soft: #5c5445;
        --rule: #a89a7c;
        --desk: #3a3630;
        --stamp-red: #8c2f24;
        --stamp-green: #2f5c33;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%;
        background: var(--desk);
        color: var(--ink);
        font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      #app { display: grid; grid-template-columns: 1fr 380px; height: 100vh; }

      /* --- Viewport ---------------------------------------------------- */
      #stage {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 10px; padding: 16px; min-width: 0;
      }
      #frame {
        position: relative; overflow: hidden;
        border: 3px solid #232019; background: #1a1814;
        box-shadow: 0 6px 24px rgba(0,0,0,.5);
        cursor: crosshair;
      }
      #lot { display: block; image-rendering: pixelated; }
      #addr {
        align-self: stretch; display: flex; justify-content: space-between;
        background: var(--manila); border: 1px solid #8a7550;
        padding: 6px 10px; font-weight: 700; letter-spacing: .04em;
      }
      #tools { display: flex; gap: 8px; align-items: center; color: #b8ae96; font-size: 12px; }
      #tools button { font: inherit; }
      #hover {
        min-height: 18px; color: #d8cfb4; font-size: 12px; font-style: italic;
      }

      /* --- Desk -------------------------------------------------------- */
      #desk {
        background: #4a453c; border-left: 3px solid #232019;
        padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      }
      .card {
        background: var(--paper); border: 1px solid #9d9075;
        box-shadow: 1px 2px 0 rgba(0,0,0,.28);
        padding: 9px 11px;
      }
      .card h2 {
        margin: 0 0 6px; font-size: 11px; letter-spacing: .12em;
        text-transform: uppercase; color: var(--ink-soft);
        border-bottom: 1px solid var(--rule); padding-bottom: 4px;
      }
      .clip { background: var(--manila); }
      .row { display: flex; justify-content: space-between; gap: 8px; }
      .row + .row { margin-top: 2px; }
      .muted { color: var(--ink-soft); }
      .art { font-weight: 700; letter-spacing: .06em; }
      details { margin-top: 6px; }
      summary { cursor: pointer; color: var(--ink-soft); font-size: 12px; }
      details[open] summary { margin-bottom: 4px; }
      .decoy {
        background: var(--paper-2); border-left: 3px solid var(--rule);
        padding: 6px 8px; font-size: 12px;
      }
      #findings ul { margin: 0; padding: 0; list-style: none; }
      #findings li {
        display: flex; justify-content: space-between; align-items: center;
        gap: 6px; padding: 4px 0; border-bottom: 1px dotted var(--rule);
      }
      #findings li:last-child { border-bottom: 0; }
      #findings .none { color: var(--ink-soft); font-style: italic; }
      #findings button {
        background: none; border: 1px solid var(--rule); color: var(--ink-soft);
        cursor: pointer; font: inherit; line-height: 1; padding: 1px 5px;
      }
      #stamps { display: flex; gap: 8px; }
      #stamps button {
        flex: 1; padding: 12px 0; font: 700 15px/1 ui-monospace, monospace;
        letter-spacing: .16em; cursor: pointer; color: #efe7d2;
        border: 2px solid rgba(0,0,0,.35); border-radius: 2px;
      }
      #btn-pass { background: var(--stamp-green); }
      #btn-fail { background: var(--stamp-red); }
      #stamps button:disabled { opacity: .4; cursor: default; }
      .btn {
        background: var(--paper-2); border: 1px solid #8a7d63; color: var(--ink);
        padding: 5px 10px; cursor: pointer; font: inherit;
      }

      /* --- Overlays ---------------------------------------------------- */
      #overlay {
        position: fixed; inset: 0; background: rgba(20,18,15,.86);
        display: none; align-items: center; justify-content: center; padding: 24px;
      }
      #overlay.on { display: flex; }
      #sheet {
        background: var(--paper); max-width: 760px; width: 100%;
        max-height: 86vh; overflow-y: auto; padding: 22px 26px;
        border: 1px solid #9d9075; box-shadow: 0 10px 40px rgba(0,0,0,.6);
      }
      #sheet h1 { margin: 0 0 2px; font-size: 17px; letter-spacing: .08em; }
      #sheet h3 { margin: 16px 0 6px; font-size: 12px; letter-spacing: .1em;
        text-transform: uppercase; color: var(--ink-soft);
        border-bottom: 1px solid var(--rule); padding-bottom: 3px; }
      #sheet p { margin: 6px 0; }
      .verdict-row { padding: 8px 10px; margin: 6px 0; background: var(--paper-2); }
      .bad { border-left: 4px solid var(--stamp-red); }
      .good { border-left: 4px solid var(--stamp-green); }
      .filed {
        position: absolute; inset: 0; display: none;
        align-items: center; justify-content: center;
        background: rgba(26,24,20,.72); color: #e8dfc6;
        font: 700 26px/1 ui-monospace, monospace; letter-spacing: .3em;
      }
      .filed.on { display: flex; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="addr"><span id="addr-l">—</span><span id="addr-r"></span></div>
        <div id="frame">
          <canvas id="lot"></canvas>
          <div class="filed" id="filed">FILED</div>
        </div>
        <div id="tools">
          <button class="btn" id="btn-zoom">ZOOM 1&times;</button>
          <span id="hover"></span>
        </div>
      </div>

      <div id="desk">
        <div class="card clip">
          <h2>Route Sheet</h2>
          <div class="row"><span>Day</span><span id="c-day">1</span></div>
          <div class="row"><span>Date</span><span id="c-date">—</span></div>
          <div class="row"><span>Street</span><span id="c-street">—</span></div>
          <div class="row"><span>Inspection</span><span id="c-prog">—</span></div>
          <div class="row"><span>Quota</span><span id="c-quota">—</span></div>
          <div class="row"><span>Strikes today</span><span id="c-strikes">0</span></div>
          <div class="row"><span>Pay</span><span id="c-pay">$0</span></div>
        </div>

        <div class="card" id="binder">
          <h2>CC&amp;R Binder</h2>
          <div id="binder-body"></div>
        </div>

        <div class="card" id="findings">
          <h2>Findings</h2>
          <ul id="find-list"></ul>
        </div>

        <div id="stamps">
          <button id="btn-pass">PASS</button>
          <button id="btn-fail">FAIL</button>
        </div>

        <div class="card">
          <h2>Case File</h2>
          <div id="casefile" class="muted">No prior rulings at this address.</div>
        </div>

        <button class="btn" id="btn-reset">Reset save</button>
      </div>
    </div>

    <div id="overlay"><div id="sheet"></div></div>
    <script type="module" src="./dist/bundle.js"></script>
  </body>
</html>
